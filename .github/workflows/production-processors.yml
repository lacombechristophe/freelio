name: Traitements de production

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: production-processors
  cancel-in-progress: false

jobs:
  process:
    if: vars.ENABLE_PRODUCTION_PROCESSORS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_URL: ${{ vars.PROCESSOR_APP_URL }}
      PROCESSOR_SECRET: ${{ secrets.PROCESSOR_CRON_SECRET }}
    steps:
      - name: Vérifier la configuration
        run: |
          test -n "$PROCESSOR_SECRET"
          test -n "$APP_URL"
          node -e 'const u = new URL(process.env.APP_URL); if (u.protocol !== "https:" || u.username || u.password || u.pathname !== "/" || u.search || u.hash) process.exit(1)'

      - name: Traiter les séquences, échéances et synchronisations
        shell: bash
        run: |
          set -euo pipefail
          call_processor() {
            curl --silent --show-error --fail-with-body \
              --retry 3 --retry-all-errors --max-time 240 \
              --request POST \
              --header "Authorization: Bearer ${PROCESSOR_SECRET}" \
              "${APP_URL}${1}"
          }
          failed=0
          for endpoint in /api/automations/process /api/scheduling/process /api/communications/sync/process /api/backup/process; do
            if ! call_processor "$endpoint"; then
              echo "::error::Échec du processeur $endpoint"
              failed=1
            fi
          done
          exit "$failed"
