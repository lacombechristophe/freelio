name: Vérification CRM

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crm-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container-runtime:
    name: Image Linux et Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Construire l’image sans secrets
        run: docker build --tag freelio:ci .
      - name: Vérifier migrations, Prisma Linux, Redis, worker et PDF
        env:
          TMPDIR: ${{ runner.temp }}
        run: node scripts/verify-container-runtime.mjs freelio:ci
      - name: Conserver l’identité de l’image et du commit
        run: |
          mkdir -p test-results
          docker image inspect freelio:ci --format '{{.Id}}' > test-results/image-id.txt
          git rev-parse HEAD > test-results/tested-commit.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: container-runtime-${{ github.sha }}
          path: |
            test-results/
            ${{ runner.temp }}/Freelio-linux-*/verification.json
          retention-days: 14
  quality-and-e2e:
    runs-on: ubuntu-latest
    # Chromium system-package installation took 429 seconds on 2026-10-07.
    # Leave room for the complete security audit and evidence uploads; retain
    # every test timeout and the failing audit gate.
    timeout-minutes: 35
    env:
      DATABASE_URL: file:./e2e-ci.db
      AUTH_SECRET: ci-auth-secret-longer-than-thirty-two-characters
      JWT_SECRET: ci-jwt-secret-longer-than-thirty-two-characters
      CONSENT_TOKEN_SECRET: ci-consent-secret-longer-than-thirty-two-characters
      ENCRYPTION_KEY: ci-encryption-secret-longer-than-thirty-two-characters
      LEAD_HASH_SALT: ci-lead-hash-salt-longer-than-thirty-two-characters
      SCHEDULER_CRON_SECRET: ci-scheduler-secret-longer-than-thirty-two-characters
      PUBLIC_LEAD_COMPANY_ID: e2e-company
      LEAD_ALLOWED_ORIGINS: https://example.test
      E2E_USER_EMAIL: qa-crm@example.com
      PUBLIC_APP_URL: http://127.0.0.1:3000
      PUBLIC_PRIVACY_NOTICE_URL: https://example.test/privacy
      AUTH_URL: http://127.0.0.1:3000
      AUTH_TRUST_HOST: "true"
      E2E_USE_PRODUCTION_SERVER: "true"
      E2E_ENABLE_CREDENTIALS_AUTH: "true"
      E2E_FULL_UI_AUDIT: "true"
      E2E_DIRECTORY_FIXTURES: "true"
      RECIPE_ISOLATED: "true"
      FILE_STORAGE_DRIVER: local

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci --no-audit --fund=false

      - name: Auditer les dépendances de production
        run: npm audit --omit=dev --audit-level=moderate

      - name: Préparer la base E2E isolée
        run: |
          npm run db:bootstrap:sqlite
          node scripts/seed-e2e.mjs

      - name: Vérifier types, lint, tests et build
        run: npm run verify

      - name: Mesurer la couverture métier critique
        run: npm run test:coverage

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Préparer les volumes de pagination dans la recette isolée
        run: node scripts/seed-ui-redesign.mjs

      - name: Exécuter les parcours critiques
        run: npm run test:e2e

      # Keep the complete security gate while retaining functional evidence
      # when a development-only advisory has no upstream patch yet.
      - name: Auditer toutes les dépendances
        if: always()
        run: npm audit --audit-level=moderate

      - name: Publier les traces en cas d’échec
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Publier les rapports de recette UI
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-audit-reports
          path: |
            test-results/full-ui-audit/
            test-results/task-usability/
            test-results/supplier-history/
            test-results/catalogue-volume/
            test-results/operations-assets/
            test-results/shared-health-permissions/
            test-results/workspace-permissions/
            test-results/opportunity-permissions/
            test-results/project-reader-permissions/
            test-results/contact-history-permissions/
          if-no-files-found: ignore
          retention-days: 14

      - name: Relier les résultats au commit testé
        if: always()
        run: |
          mkdir -p test-results
          git rev-parse HEAD > test-results/tested-commit.txt
          node --version > test-results/node-version.txt

      - name: Publier les preuves SQLite et la couverture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-sqlite-${{ github.sha }}
          path: |
            test-results/tested-commit.txt
            test-results/node-version.txt
            coverage/
          retention-days: 14

  postgres-integration:
    name: Intégration PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d crm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://crm:crm@localhost:5432/crm_test?schema=public
      AUTH_SECRET: ci-auth-secret-longer-than-thirty-two-characters
      JWT_SECRET: ci-jwt-secret-longer-than-thirty-two-characters
      CONSENT_TOKEN_SECRET: ci-consent-secret-longer-than-thirty-two-characters
      ENCRYPTION_KEY: ci-encryption-secret-longer-than-thirty-two-characters
      LEAD_HASH_SALT: ci-lead-hash-salt-longer-than-thirty-two-characters
      SCHEDULER_CRON_SECRET: ci-scheduler-secret-longer-than-thirty-two-characters
      FILE_STORAGE_DRIVER: local

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci --no-audit --fund=false

      - name: Générer le client PostgreSQL
        run: npm run db:generate

      - name: Appliquer les migrations PostgreSQL
        run: npm run db:deploy:postgres

      - name: Exécuter les tests unitaires sur PostgreSQL
        run: npm run test:unit -- --reporter=default --reporter=json --outputFile=test-results/unit-postgres.json

      - name: Relier les résultats PostgreSQL au commit testé
        if: always()
        run: |
          mkdir -p test-results
          git rev-parse HEAD > test-results/tested-commit.txt
          node --version > test-results/node-version.txt

      - name: Publier les preuves PostgreSQL
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-postgres-${{ github.sha }}
          path: |
            test-results/unit-postgres.json
            test-results/tested-commit.txt
            test-results/node-version.txt
          retention-days: 14
