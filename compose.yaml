name: freelio-development
services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: freelio_dev
      POSTGRES_PASSWORD: local-only-freelio-development
      POSTGRES_DB: freelio_dev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-development:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freelio_dev -d freelio_dev"]
      interval: 5s
      timeout: 3s
      retries: 12
  redis:
    image: redis:7.4-bookworm
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - redis-development:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  postgres-development:
  redis-development:
